[project]
name = "universal-consultant"
version = "0.1.0"
description = "Диалоговый консультант по товарам и услугам: заказ или запись после явного согласия клиента."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_consultant"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]
eda = [
    "matplotlib>=3.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "parsers"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["RUF001", "RUF002"]
"parsers/**" = ["RUF001"]
"src/universal_consultant/**" = ["RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["universal_consultant"]

[tool.ruff.format]
docstring-code-format = true
